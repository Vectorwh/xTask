# Text-only JoyAI-Video T2AV negative-control regression: no external embeddings.
# Scoring methods reuse industry detection/contrastive ideas; acceptance thresholds
# are PROVISIONAL xTask engineering policy, NOT an official VBench/VABench standard.
# Prepare frozen offline GroundingDINO/CLAP checkpoints and a real JoyOV2 endpoint.
# 12 conditions => 24 generated videos; each modality needs 6 annotated conditions
# and >=3 informative controls, otherwise INCONCLUSIVE (never a silent pass).
# Full audio/video synchronization and action semantics are not evaluated here.
case_name: 49_external_joyai_video_negative_semantics
engine_type: xllm
served_model_name: JoyAI-Video
metrics: acc
dataset_name: joyai_video_smoke
external_service:
  enabled: true
  endpoint: http://127.0.0.1:8018
  health_path: /health
benchmark:
  benchmark_type: vbench
  vbench:
    task: t2av
    scenario: cfg_pair
    mode: generate_and_evaluate
    manifest: ${DEPENDENCE_PACKAGE_PATH}/datasets/joyai_video/joyai_video_negative_semantics.jsonl
    generation:
      size: 512*288
      num_frames: 81
      fps: 16
      num_inference_steps: 50
      guidance_scale: 4.0
      flow_shift: 8.0
      seed: 42
      sampling_rate: 44100
      concurrency: 1
      repeats: 1
      warmups: 0
      request_timeout: 1800
      limit: 0
    media:
      audio: required
      duration_tolerance_s: 0.25
      channels: 2
    evaluation:
      enabled: true
      dimensions:
      - subject_consistency
      - background_consistency
      - motion_smoothness
      - dynamic_degree
      - aesthetic_quality
      - imaging_quality
      device: cpu
      local: true
      code_root: ${DEPENDENCE_PACKAGE_PATH}/benchmark/vbench2
    gates: []
    checks:
      negative_control:
        backend: benchmark_semantics
        profile: xtask_negative_v1
        device: cpu
        python_exec: ${DEPENDENCE_PACKAGE_PATH}/joyai_video_benchmark/semantic_env/bin/python
        vision:
          model_path: ${DEPENDENCE_PACKAGE_PATH}/joyai_video_benchmark/grounding-dino-tiny
          frames: 16
          max_side: 768
          box_threshold: 0.4
          text_threshold: 0.3
        audio:
          model_path: ${DEPENDENCE_PACKAGE_PATH}/joyai_video_benchmark/clap-htsat-unfused
          window_seconds: 5.0
          stride_seconds: 2.5
          margin: 0.05
          similarity_min: 0.15
        policy:
          min_conditions: 6
          min_informative_conditions: 3
          reference_presence_min: 0.1
          target_forbidden_max: 0.1
          relative_reduction_min: 0.25
          improvement_rate_min: 0.6
          required_presence_min: 0.5
          positive_drop_max: 0.05
          improvement_epsilon: 0.02
        timeout: 3600
benchmark_timeout: 14400
