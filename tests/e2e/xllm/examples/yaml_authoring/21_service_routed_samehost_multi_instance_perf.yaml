case_name: 21_service_routed_samehost_multi_instance_perf
engine_type: xllm
model_path: /export/home/models/Qwen3-8B
served_model_name: Qwen3-8B
metrics: perf
dataset_name: gsm8k
dataset_path: ''
dataset_format: json
communication_backend: hccl
userid: 1048
serving_wait_time: 10

benchmark:
  benchmark_type: aisbench
  perf:
    case_type: performance
    api_type: vllm_api_general_stream
    dataset_conf: gsm8k_gen_0_shot_cot_str_perf
    input_len: 1024
    output_len: 256
    max_out_len: 256
    batch_size: 2
    request_rate: 0
    num_prompts: 8
    num_warmups: 2
    generation_kwargs:
      temperature: 0
      ignore_eos: true

deployment:
  mode: service_routed
  master_host: 11.87.191.75
  sync_workspace: true
  service_control:
    host: 11.87.191.75
    etcd_client_port: 13389
    etcd_peer_port: 13390
    http_server_port: 13888
    rpc_server_port: 13889
  benchmark:
    runner_instance: default-0-node-0
    health_path: /health
  service_instances:
  - name: default-0
    group_master_host: 11.87.191.75
    progress_conn_port: 9590
    serving_extensiable_param: &service_params
      max_memory_utilization: 0.85
      max_seqs_per_batch: 10
      enable_shm: true
      dp_size: 1
      enable_graph: false
    nodes:
    - name: default-0-node-0
      host: 11.87.191.75
      device_ids: [8, 9]
      local_port: 48000
      hccl_if_port: 43439
  - name: default-1
    group_master_host: 11.87.191.75
    progress_conn_port: 9690
    serving_extensiable_param: *service_params
    nodes:
    - name: default-1-node-0
      host: 11.87.191.75
      device_ids: [10, 11]
      local_port: 48100
      hccl_if_port: 43539
