# startup_environment 是一组原样写入 xLLM 启动脚本的 shell 行。
# 插入位置在模板自带的 export / rm 之后、拉起 xllm 之前，所以后面的 export 可以覆盖模板默认值。
# 不写这个字段，或写成空列表，启动脚本不插入任何行。
#
# 可写位置：
# - 没有 deployment 的旧用例：YAML 顶层，整份用例共用一份脚本
# - deployment.instances[]：每一项已经是一个 node，字段写在该项上
# - deployment.pd_instances[] / deployment.service_instances[]：
#   写在逻辑实例上时，其下每个 node 都继承；某个 node 自己写了同名字段，整段替换，不与上面的列表拼接
#
# 本样板用 PD 展示继承和替换。普通多机、service_routed、旧单机的字段位置见上面说明。
case_name: 28_startup_environment
engine_type: xllm
model_path: /export/home/models/Qwen3-8B
served_model_name: Qwen3-8B
metrics: perf
dataset_name: gsm8k
dataset_path: ''
dataset_format: json
communication_backend: hccl
userid: 1048
serving_wait_time: 10

benchmark:
  benchmark_type: aisbench
  perf:
    case_type: performance
    api_type: vllm_api_general_stream
    dataset_conf: gsm8k_gen_0_shot_cot_str_perf
    input_len: 1024
    output_len: 256
    max_out_len: 256
    batch_size: 1
    request_rate: 1
    num_prompts: 4
    num_warmups: 2
    generation_kwargs:
      temperature: 0
      ignore_eos: true

deployment:
  mode: pd_disaggregated
  master_host: 11.87.191.75
  sync_workspace: true
  pd_control:
    host: 11.87.191.75
    etcd_client_port: 13389
    etcd_peer_port: 13390
    http_server_port: 13888
    rpc_server_port: 13889
  benchmark:
    runner_instance: prefill-0-node-0
    health_path: /health
  pd_instances:
  - name: prefill-0
    role: prefill
    group_master_host: 11.87.191.75
    progress_conn_port: 9590
    transfer_port_base: 26000
    disagg_pd_port: 7777
    serving_extensiable_param:
      max_memory_utilization: 0.85
      max_seqs_per_batch: 10
      enable_shm: true
      enable_heterogeneous_pd: true
      dp_size: 1
      enable_graph: false
    startup_environment:
    - export HCCL_CONNECT_TIMEOUT=1800
    - export ASCEND_SLOG_PRINT_TO_STDOUT=1
    - export ASCEND_GLOBAL_LOG_LEVEL=3
    nodes:
    - name: prefill-0-node-0
      host: 11.87.191.75
      device_ids: [0, 1]
      local_port: 48000
      hccl_if_port: 43439
    - name: prefill-0-node-1
      host: 11.87.191.75
      device_ids: [2, 3]
      local_port: 48010
      hccl_if_port: 43449
      startup_environment:
      - export HCCL_CONNECT_TIMEOUT=3600
      - export ASCEND_SLOG_PRINT_TO_STDOUT=0
  - name: decode-0
    role: decode
    group_master_host: 11.87.191.121
    progress_conn_port: 9690
    transfer_port_base: 27000
    disagg_pd_port: 7787
    serving_extensiable_param:
      max_memory_utilization: 0.85
      max_seqs_per_batch: 10
      enable_shm: true
      enable_heterogeneous_pd: true
      dp_size: 1
      enable_graph: false
    nodes:
    - name: decode-0-node-0
      host: 11.87.191.121
      device_ids: [0, 1]
      local_port: 48100
      hccl_if_port: 43539
