case_name: 20_pd_samehost_multi_instance_perf
engine_type: xllm
model_path: /export/home/models/Qwen3-8B
served_model_name: Qwen3-8B
metrics: perf
dataset_name: gsm8k
dataset_path: ''
dataset_format: json
communication_backend: hccl
userid: 1048
serving_wait_time: 10

benchmark:
  benchmark_type: aisbench
  perf:
    case_type: performance
    api_type: vllm_api_general_stream
    dataset_conf: gsm8k_gen_0_shot_cot_str_perf
    input_len: 1024
    output_len: 256
    max_out_len: 256
    batch_size: 1
    request_rate: 1
    num_prompts: 4
    num_warmups: 2
    generation_kwargs:
      temperature: 0
      ignore_eos: true

deployment:
  mode: pd_disaggregated
  master_host: 11.87.191.75
  sync_workspace: true
  # 显式 C/R 复用引擎容器；etcd 与模型传输参数保持本用例原值。
  xllm_service:
    service_binary_profile: auto
    etcd:
      host: 11.87.191.75
      client_port: 13389
      peer_port: 13390
      container_instance: prefill-0-node-0
    startup_attempts: 2
    startup_wait_seconds: 3
    master_key_wait_seconds: 30
    coordinators:
      - name: coordinator-0
        host: 11.87.191.75
        http_server_port: 28888
        rpc_server_port: 28889
        container_instance: prefill-0-node-0
    routers:
      - name: router-0
        host: 11.87.191.75
        http_server_port: 38888
        rpc_server_port: 38889
        container_instance: decode-0-node-0
  benchmark:
    runner_instance: prefill-0-node-0
    health_path: /readyz
    router_instance: router-0
  pd_instances:
  - name: prefill-0
    role: prefill
    group_master_host: 11.87.191.75
    progress_conn_port: 9590
    transfer_port_base: 26000
    disagg_pd_port: 7777
    serving_extensiable_param:
      max_memory_utilization: 0.85
      max_seqs_per_batch: 10
      enable_shm: true
      enable_heterogeneous_pd: true
      dp_size: 1
      enable_graph: false
    nodes:
    - name: prefill-0-node-0
      host: 11.87.191.75
      device_ids: [8]
      local_port: 48000
      hccl_if_port: 43439
    - name: prefill-0-node-1
      host: 11.87.191.75
      device_ids: [9]
      local_port: 48010
      hccl_if_port: 43449
  - name: prefill-1
    role: prefill
    group_master_host: 11.87.191.75
    progress_conn_port: 9690
    transfer_port_base: 27000
    disagg_pd_port: 7797
    serving_extensiable_param:
      max_memory_utilization: 0.85
      max_seqs_per_batch: 10
      enable_shm: true
      enable_heterogeneous_pd: true
      dp_size: 1
      enable_graph: false
    nodes:
    - name: prefill-1-node-0
      host: 11.87.191.75
      device_ids: [10, 11]
      local_port: 48100
      hccl_if_port: 43539
  - name: decode-0
    role: decode
    group_master_host: 11.87.191.75
    progress_conn_port: 9790
    transfer_port_base: 28000
    disagg_pd_port: 7787
    serving_extensiable_param:
      max_memory_utilization: 0.85
      max_seqs_per_batch: 10
      enable_shm: true
      enable_heterogeneous_pd: true
      dp_size: 1
      enable_graph: false
    nodes:
    - name: decode-0-node-0
      host: 11.87.191.75
      device_ids: [12]
      local_port: 48200
      hccl_if_port: 43639
    - name: decode-0-node-1
      host: 11.87.191.75
      device_ids: [13]
      local_port: 48210
      hccl_if_port: 43649
  - name: decode-1
    role: decode
    group_master_host: 11.87.191.75
    progress_conn_port: 9890
    transfer_port_base: 29000
    disagg_pd_port: 7807
