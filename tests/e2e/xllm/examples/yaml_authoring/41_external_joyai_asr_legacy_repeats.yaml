# Real-service archival/report regression: 2 repeats, each all 1162 samples.
# Validated 2026-11-04: 2324/2324, 0 failures, global/group Excel and archives pass.
# Evidence: docs/asr_real_service_validation_20261104.md.
# External JoyaiASR service; no remote process restart/cleanup.
# One server lifetime: network/cache effects apply; no performance baseline.
# Hardware/TP information in provenance is supplied documentation, not
# independently verified telemetry.
case_name: 41_external_joyai_asr_legacy_repeats
engine_type: xllm
external_service:
  enabled: true
  endpoint: http://11.87.191.101:8018
  health_path: /health
served_model_name: JoyaiASR
metrics: acc,perf
dataset_name: ta3_test0925_quiet
dataset_format: jsonl
userid: 1003
benchmark:
  benchmark_type: asr
  asr:
    backend: legacy_infer
    dataset_name: ta3_test0925_quiet
    expected_samples: 1162
    limit: 0
    api: audio
    concurrency:
    - 2
    repeats: 2
    use_context: true
    stream: true
    timeout: 300
    max_audio_seconds: 30
    scoring_profile: joyai_legacy
    cache_condition: service_lifetime
    warmup:
      synthetic_requests: 3
      api: audio
      exclude_first: 0
    generation:
      temperature: 0
      repetition_penalty: 1.05
      language: zh
    gates:
    - metric: error_rate_pct
      compare: lte
      baseline: 5.0
    - metric: failed_requests
      compare: lte
      baseline: 0
    provenance:
      deployment_source: asr_doc/JoyaiASR模型xllm性能复现文档.pdf
      reported_hardware: Ascend NPU
      reported_tp_size: 2
      reported_ctc: true
      reported_speculative_algorithm: Suffix
      deployment_independently_verified: false
      server_commit: unknown
      measurement_location: client 11.87.191.75 -> server 11.87.191.101
      cache_note: External service already running; not a cold-cache measurement.
      validation_scope: '2026-11-04 real endpoint regression: full dataset x 2 repeats;
        date archive, CSV, global/group Excel'
