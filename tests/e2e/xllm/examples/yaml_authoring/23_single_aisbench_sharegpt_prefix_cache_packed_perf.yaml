case_name: 23_single_aisbench_sharegpt_prefix_cache_packed_perf
engine_type: xllm
model_path: /export/home/models/Qwen3-8B
served_model_name: Qwen3-8B
metrics: perf
dataset_name: sharegpt
dataset_format: json
communication_backend: hccl
userid: 1048
serving_wait_time: 10

# Long-context reference: the selected model and xLLM KV Cache configuration
# must support input_len + output_len (153600 + 512) tokens.
benchmark:
  benchmark_type: aisbench
  perf:
    case_type: performance
    api_type: vllm_api_stream_chat_multiturn
    dataset_conf: sharegpt_gen
    infer_mode: last
    input_len: 153600
    output_len: 512
    max_out_len: 512
    batch_size: 8
    request_rate: 0
    num_prompts: 40
    num_warmups: 4
    prefix_cache:
      enabled: true
      prefix_source: dataset
      prefix_assembly: packed
      prefix_len: 131072
      prefix_groups: 4
      seed_requests: true
      order: grouped
    baseline: null
    threshold: 0.10
    generation_kwargs:
      temperature: 0
      ignore_eos: true

deployment:
  master_host: 11.87.191.75
  benchmark:
    runner_instance: master-0
    health_path: /health
  instances:
  - name: master-0
    host: 11.87.191.75
    role: master
    rank_start: 0
    device_ids: [0, 1]
    local_port: 8800
    serving_extensiable_param:
      max_memory_utilization: 0.85
      max_seqs_per_batch: 16
      enable_chunked_prefill: true
      enable_schedule_overlap: true
      enable_prefix_cache: true
      enable_shm: true
      block_size: 128
      enable_graph: true
      enable_graph_mode_decode_no_padding: true
