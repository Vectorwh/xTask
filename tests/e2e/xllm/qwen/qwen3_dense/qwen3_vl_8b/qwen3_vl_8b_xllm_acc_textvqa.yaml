additional_config: ''
benchmark:
  benchmark_type: aisbench
  acc:
    api_type: vllm_api_stream_chat
    baseline: 80.14
    batch_size: 6
    case_type: accuracy
    dataset_conf: textvqa_gen_base64
    dataset_path:
    dump_eval_details: true
    dump_extract_rate: false
    enable_debug: false
    enable_thinking: false
    input_len: ''
    max_num_worker: 1
    max_out_len: ''
    merge_ds: false
    num_prompts: 500
    output_len: 32768
    pressure: false
    request_rate: 6
    threshold: 0.04
    generation_kwargs:
      temperature: 0.5
      ignore_eos: false
      top_k: 10
      top_p: 0.95
      seed: None
      repetition_penalty: 1.03
block_size: 128
case_name: qwen3_vl_8b_xllm_acc_textvqa
communication_backend: hccl
dataset_format: json
dataset_name: textvqa
dataset_path: ''
engine_type: xllm
metrics: acc
model_path: /export/home/models/Qwen3-VL-8B-Instruct
served_model_name: Qwen3-VL-8B-Instruct
userid: 1048
serving_wait_time: 10
deployment:
  mode: service_routed
  master_host: 11.87.191.75
  xllm_service:
    service_binary_profile: auto
    host: 11.87.191.75
    etcd_client_port: 22389
    etcd_peer_port: 22380
    http_server_port: 38888
    rpc_server_port: 28889
    coordinator_http_server_port: 28888  # 端口与 PD 分离用例对齐: etcd 22389/22380, coordinator 28888/28889, router 38888/38889 (串行执行共用)
  benchmark:
    runner_instance: default-0-node-0
    router_instance: router-0
    health_path: /health
  service_instances:
  - name: default-0
    group_master_host: 11.87.191.75
    progress_conn_port: 9590
    serving_extensiable_param:
      max_memory_utilization: 0.85
      enable_chunked_prefill: true
      enable_schedule_overlap: true
      enable_prefix_cache: true
      enable_shm: true
      backend: vlm
      max_encoder_cache_size: 128
      enable_intralayer_addnorm: true
      enable_interlayer_addnorm: true
      enable_split_rmsnorm_rope: true
      limit_image_per_prompt: 8
      enable_graph: true
      enable_graph_mode_decode_no_padding: true
    nodes:
    - name: default-0-node-0
      host: 11.87.191.75
      device_ids: [0, 1]
      local_port: 8800
