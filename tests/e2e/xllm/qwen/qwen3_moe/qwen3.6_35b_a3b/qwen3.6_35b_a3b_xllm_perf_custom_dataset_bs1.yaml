# Qwen3.6-35B-A3B TP2/MTP3（Draft Body TP1）自定义 jsonl 转测。
# E2E < 418 ms；平均 output_tokens 相对 55.2667 ±1%。不自动卡门 usage 30/30、三轮重启服务。
# dataset_name: custom_dataset；num_prompts 大于 jsonl 条数时按条循环拼接（同一次服务）。
additional_config: ''
benchmark:
  benchmark_type: aisbench
  perf:
    acc_dataset_len: 0
    api_type: vllm_api_stream_chat
    baseline:
    batch_size: 1
    case_type: performance
    dataset_conf: custom_dataset_gen
    dataset_path: /workspace/xtask/datasets/custom/prompt_30.jsonl
    dump_eval_details: false
    dump_extract_rate: false
    enable_debug: false
    enable_thinking: false
    max_num_worker: 1
    max_out_len: 128
    merge_ds: false
    num_prompts: 30
    output_len: 128
    pressure: false
    request_rate: 0
    baseline_metrics:
    - metric: e2el_avg
      baseline: 365
      compare: lt
    - metric: output_tokens_avg
      baseline: 55.2667
      threshold: 0.01
    threshold: 0.1
    num_warmups: 5
    ignore_eos: false
    generation_kwargs:
      temperature: 0
      ignore_eos: false
block_size: 128
case_name: qwen3.6_35b_a3b_xllm_perf_custom_dataset_bs1
communication_backend: lccl
dataset_format: json
dataset_name: custom_dataset
dataset_path: ''
engine_type: xllm
metrics: perf
model_path: /export/home/models/Qwen3.6-35B-A3B
served_model_name: Qwen3.6-35B-A3B
userid: 1048
serving_wait_time: 10
deployment:
  mode: service_routed
  master_host: 11.87.191.75
  xllm_service:
    service_binary_profile: auto
    host: 11.87.191.75
    etcd_client_port: 22389
    etcd_peer_port: 22380
    http_server_port: 38888
    rpc_server_port: 28889
    coordinator_http_server_port: 28888  # 端口与 PD 分离用例对齐: etcd 22389/22380, coordinator 28888/28889, router 38888/38889 (串行执行共用)
  benchmark:
    runner_instance: default-0-node-0
    router_instance: router-0
    health_path: /health
  service_instances:
  - name: default-0
    group_master_host: 11.87.191.75
    progress_conn_port: 9590
    serving_extensiable_param:
      max_memory_utilization: 0.70
      max_tokens_per_batch: 8192
      max_tokens_per_chunk_for_prefill: 8192
      max_seqs_per_batch: 8
      block_size: 128
      enable_prefix_cache: true
      enable_chunked_prefill: true
      enable_schedule_overlap: true
      enable_graph: true
      enable_shm: true
      max_concurrent_requests: 8
      draft_model: /export/home/models/Qwen3.6-35B-A3B-MTP
      num_speculative_tokens: 3
      enable_mtp_draft_body_tp1: true
    nodes:
    - name: default-0-node-0
      host: 11.87.191.75
      device_ids: [0, 1]
      local_port: 8800
