# Qwen-Image-Edit 图片编辑性能测试（benchmark_type: image_edit）。
#
# 流程：先用 tools/convert_gedit_to_perf.py 把 GEdit-Bench 转成
# gedit_perf.jsonl（images 字段存绝对路径，不存 base64），再由
# xtask/benchmarks/evalscope/generate_image_edit_script.py 生成脚本，
# 调 xtask/plugins/evalscope/run_gedit_perf.py（先注册 gedit_image_gen
# API 插件再跑 evalscope perf，服务端点 POST /v1/image/generation）。
#
# 两段式协议（Qwen-Image-Edit-2509 解耦部署）：
#   1. Text Encoder（POST {encoder_url}/v1/embeddings）产出 pos/neg embedding
#      （给 encoder 的图先 resize 1024x1024，bfloat16 解码后 skip 64 token）
#   2. DiT（POST /v1/image/generation）带 prompt_embed 出图
# encoder 地址优先级：benchmark.perf.encoder_url > 环境变量
# GEDIT_ENCODER_URL > http://127.0.0.1:18007（见 gedit_api.py）。
#
# 自服务模式（deployment.encoder/dit，与 deployment.benchmark 等同级）：
# 调度器为本用例自动拉起 Text Encoder + DiT 两组 xLLM 服务（各自独立
# 容器、独立设备/端口），评测结束后自动收容器。服务启动参数即
# tmp/gedit_svc/start_encoder.sh 与 start_dit.sh 中验证过的参数：
#   - Encoder: 单卡 NPU7、端口 18007、task=embed、独立 master 29798
#   - DiT: 6 卡 NPU0-5、sp3*cfg2、master 19757、起始端口 19000
#     （按 rank 连续自增 → 19000-19005，与 encoder 18007 互不冲突）。
#     容器挂载 hccn.conf/driver/add-ons/npu-smi 与
#     pkg/xllm/vendors/custom_xllm_math（缺一 aclInit 507008 core dump），
#     由 xtask/core/gedit_service.py 自动注入。
#
# 指标语义（gedit 插件重定义 token 槽位）：
#   - Avg Input Tokens  = 平均输入图片张数
#   - Avg Output Tokens = 平均每次请求产出兆像素（MPx）
#   - Output Throughput (tok/s) = MPx/s（产出兆像素每秒）
# baseline 语义即 MPx/s：单并发 1328*1328 出图的理论值约 1.76 MPx/张。
case_name: qwen_image_edit_single_image_perf
engine_type: xllm
model_path: /export/home/models/Qwen-Image-Edit-2509
served_model_name: Qwen-Image-Edit-2509
metrics: perf
dataset_name: gedit
dataset_format: json
communication_backend: hccl
userid: 1048
serving_wait_time: 30

deployment:
  # service_routed: 同时部署 xllm-service 控制面（coordinator/router/etcd），
  # 挂靠 gedit 已有服务容器（不新增引擎容器）。gedit 两段式请求仍直连
  # encoder/dit 端点——router 不转发 gedit 私有协议，控制面仅为统一部署。
  mode: service_routed
  xllm_service:
    service_binary_profile: auto
    host: 11.87.191.75
    etcd_client_port: 22389
    etcd_peer_port: 22380
    http_server_port: 38888
    rpc_server_port: 28889
    coordinator_http_server_port: 28888  # 端口与 PD 分离用例对齐: etcd 22389/22380, coordinator 28888/28889, router 38888/38889 (串行执行共用)
    # gedit 两段式流量（阶段1 /v1/embeddings、阶段2 /v1/image/generation）
    # 全部切到 xllm-service router：引擎注册缺失、路由不支持等服务侧问题
    # 会直接在用例上 fail 暴露（当前预期 fail：DiT 引擎未实现 etcd 注册、
    # router 无 image/generation 路由）。删掉或置 false 即恢复直连。
    route_gedit_traffic: true
    extra_service_args:
      # diffusers 结构模型 tokenizer.json 在子目录，coordinator/Router 默认
      # 在 --tokenizer_path 根（=model_path）找，找不到会回退 SentencePiece
      # 并 FATAL。显式覆盖为子目录（与 joyai_video 用例同法）。
      tokenizer_path: /export/home/models/Qwen-Image-Edit-2509/tokenizer
  encoder:
    device_ids: [7]
    port: 18007
    master_node_addr: 127.0.0.1:29798
    health_path: /health
    # 启动环境与手工脚本一致（hccl_if_port 独立避开 DiT 的 43432）
    hccl_if_port: 43438
    serving_extensiable_param:
      max_memory_utilization: 0.86
      max_tokens_per_batch: 40000
      max_seqs_per_batch: 256
      block_size: 128
      enable_prefix_cache: false
      enable_chunked_prefill: true
      enable_schedule_overlap: false
      enable_shm: true
      enable_return_mm_full_embeddings: 1
      task: embed
  dit:
    device_ids: [0, 1, 2, 3, 4, 5]
    # 每卡一个 xLLM 进程；端口按 rank 从 19000 连续自增（19000-19005），
    # 与 encoder 的 18007 互不冲突，无需逐卡列举。
    port: 19000
    master_node_addr: 127.0.0.1:19757
    health_path: /health
    hccl_if_port: 43432
    # DiT 6 卡加载较慢，给足就绪时间（默认 900s）
    readiness_timeout: 1800
    serving_extensiable_param:
      model_id: Qwen-Image-Edit-2509
      backend: dit
      dit_cache_policy: None
      dit_cache_warmup_steps: 0
      cfg_size: 2
      sp_size: 3
      enable_prefix_cache: false
      enable_chunked_prefill: false
      enable_schedule_overlap: false
      enable_shm: true
      use_contiguous_input_buffer: false
      max_memory_utilization: 0.6

benchmark:
  benchmark_type: image_edit
  perf:
    case_type: performance
    # 数据集 jsonl（由 tools/convert_gedit_to_perf.py 生成）。
    # 默认路径 <DEPENDENCE_PACKAGE_PATH>/benchmark/ais_bench/datasets/
    # gedit_perf/gedit_perf.jsonl；显式写 benchmark.perf.dataset_path 可覆盖。
    num_prompts: 20
    batch_size: 1
    request_rate: -1
    warmup_num: 2
    seed: 42
    # 单请求超时（秒）：出图较慢，给足余量
    timeout: 3600
    # 以下为请求体级参数，经 --extra-args 透传；数据集行内有同名字段时以行为准
    size: "1328*1328"
    num_inference_steps: 50
    guidance_scale: 3.5
    # 两段式协议的 Text Encoder 地址（DiT 端点自动取 deployment.dit）。
    # 留空则由调度器按 deployment.encoder 注入 http://127.0.0.1:18007。
    encoder_url: http://127.0.0.1:18007
    # 量纲为 MPx/s；2026-10-26 实测（6卡DiT sp3*cfg2 + 单卡encoder，20条 1328*1328*50step）
    baseline: 0.0973
    threshold: 0.10
